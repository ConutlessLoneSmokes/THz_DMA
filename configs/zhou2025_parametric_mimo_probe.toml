[training]
seed = 2026100911
validation_seed = 2026100912
batch_size = 32
epochs = 16
learning_rate = 0.0001
validation_every = 32
validation_scenes = 32

[sure]
epochs = 8
epsilon = 0.00001
precision = "float64"

[evaluation_run]
scene_limit = 4
validation_scenes = 4
baseline_count = 256
pilot_counts = [64, 38]
pilot_seed = 2026100921
noise_seed = 2026100922
