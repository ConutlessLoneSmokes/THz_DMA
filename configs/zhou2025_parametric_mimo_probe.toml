transmit_antennas = 64
spacing_wavelengths = 0.5
departure_min_deg = -60.0
departure_max_deg = 60.0

[channel]
num_paths = 3
range_min_m = 1.85
range_max_m = 2.15
azimuth_min_deg = 15.0
azimuth_max_deg = 25.0
elevation_min_deg = -8.0
elevation_max_deg = 8.0
los_complex_gain_magnitude = 1.0
reflection_excess_range_min_m = 0.08
