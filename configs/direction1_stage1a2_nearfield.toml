[experiment]
name = "direction1_stage1a2_nearfield_closure"
replicate_seeds = [2026090801, 2026090802, 2026090803, 2026090804, 2026090805]
samples_per_seed = 20
bootstrap_seed = 2026090899
bootstrap_resamples = 1000
randomization_seed = 2026090812

[system]
carrier_frequency_hz = 3.0e11
bandwidth_hz = 3.0e10
num_subcarriers = 128

[channel]
range_min_m = 1.85
range_max_m = 2.15
angle_min_deg = 15.0
angle_max_deg = 25.0
complex_gain_magnitude = 1.0
include_absorption = true

[search]
range_min_m = 1.70
range_max_m = 2.30
range_step_m = 0.005
angle_min_deg = 10.0
angle_max_deg = 30.0
angle_step_deg = 0.25
dictionary_chunk_size = 32

[atmosphere]
table_path = "data/atmosphere/data_freq_abscoe.txt"
interpolation = "linear"
max_model_frequency_hz = 1.0e12

[dma]
num_elements = 320
spacing_wavelengths = 0.2
quality_factor = 100.0
tuning_bandwidth_hz = 3.0e10
waveguide_effective_index = 2.5
waveguide_end_power_fraction = 0.2
candidate_pool_size = 64
candidate_seed_start = 2026090700
selection_range_points = 3
selection_angle_points = 41
selection_quantile = 0.1

[design]
physical_pilot_counts = [128]
physical_timescan_num_configurations = []
flat_num_configurations = [1]
flat_total_pilot_re = 128

[estimator]
models = ["spherical", "far_field"]

[noise]
input_array_snr_db = [10.0, 15.0, 20.0, 25.0, 30.0, 35.0, 40.0]
matched_output_snr_db = [-15.0, -10.0, -5.0, 0.0, 5.0, 10.0]
include_noiseless = true

[resources]
num_rf_outputs = 1
pilot_energy_per_re = 1.0
switch_guard_symbol_equivalents = 0.0
