[experiment]
name = "direction1_stage1a_los_paired"
replicate_seeds = [2026090801, 2026090802, 2026090803, 2026090804, 2026090805]
samples_per_seed = 20
input_snr_db = [-5.0, 0.0, 5.0, 10.0, 15.0, 20.0]
bootstrap_seed = 2026090899
bootstrap_resamples = 1000

[system]
carrier_frequency_hz = 3.0e11
bandwidth_hz = 3.0e10
num_subcarriers = 128
pilot_subcarrier_stride = 1

[channel]
range_min_m = 1.85
range_max_m = 2.15
angle_min_deg = 15.0
angle_max_deg = 25.0
complex_gain_magnitude = 1.0
include_absorption = true

[search]
range_min_m = 1.70
range_max_m = 2.30
range_step_m = 0.005
angle_min_deg = 10.0
angle_max_deg = 30.0
angle_step_deg = 0.25
dictionary_chunk_size = 64

[atmosphere]
table_path = "data/atmosphere/data_freq_abscoe.txt"
interpolation = "linear"
max_model_frequency_hz = 1.0e12

[dma]
num_elements = 64
spacing_wavelengths = 0.2
quality_factor = 100.0
tuning_bandwidth_hz = 3.0e10
waveguide_effective_index = 2.5
waveguide_end_power_fraction = 0.2
configuration_seed = 20260907

[resources]
training_symbols = 1
num_configurations = 1
num_switches = 0
num_rf_outputs = 1
pilot_energy_per_re = 1.0

