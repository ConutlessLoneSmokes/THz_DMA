[experiment]
name = "direction1_stage1d_tensor_transfer"
replicate_seeds = [2026090801, 2026090802, 2026090803, 2026090804, 2026090805]
samples_per_seed = 20
bootstrap_seed = 2026091099
bootstrap_resamples = 1000
randomization_seed = 2026091013
research_decision_enabled = true
design_families = ["physical_frequency_response", "physical_tensor_scan"]
estimators = ["grid_omp", "yang_ogols_adapted", "zhang_cpd_ogols_adapted"]

[system]
carrier_frequency_hz = 3.0e11
bandwidth_hz = 3.0e10
num_subcarriers = 128

[channel]
range_min_m = 1.85
range_max_m = 2.15
angle_min_deg = 15.0
angle_max_deg = 25.0
los_complex_gain_magnitude = 1.0
include_absorption = true

[[scenarios]]
name = "nominal"
reflection_excess_range_min_m = 0.08
reflection_excess_range_max_m = 0.25
reflection_angle_separation_min_deg = 4.0
reflection_angle_separation_max_deg = 12.0
reflection_gain_relative_min_db = -12.0
reflection_gain_relative_max_db = -6.0

[search]
range_min_m = 1.70
range_max_m = 2.50
range_step_m = 0.01
angle_min_deg = 0.0
angle_max_deg = 40.0
angle_step_deg = 0.5
dictionary_chunk_size = 32

[atmosphere]
table_path = "data/atmosphere/data_freq_abscoe.txt"
interpolation = "linear"
max_model_frequency_hz = 1.0e12

[dma]
num_elements = 320
spacing_wavelengths = 0.2
quality_factor = 100.0
tuning_bandwidth_hz = 3.0e10
waveguide_effective_index = 2.5
waveguide_end_power_fraction = 0.2
candidate_pool_size = 64
candidate_seed_start = 2026090700
selection_range_min_m = 1.85
selection_range_max_m = 2.40
selection_angle_min_deg = 3.0
selection_angle_max_deg = 37.0
selection_range_points = 3
selection_angle_points = 41
selection_quantile = 0.1

[design]
physical_pilot_counts = [128]
physical_timescan_num_configurations = []
physical_tensor_num_configurations = [4]
physical_tensor_pilots_per_configuration = 32
flat_num_configurations = []
flat_total_pilot_re = 128

[estimator]
exclusion_range_m = 0.015
exclusion_angle_deg = 0.75

[estimator.yang_ogols_adapted]
refinement_iterations = 4
derivative_fraction = 0.10
maximum_update_grid_units = 0.50
convergence_tolerance = 1.0e-6

[estimator.zhang_cpd_ogols_adapted]
rank = 2
hankel_rows = 0
cp_max_iterations = 40
cp_convergence_tolerance = 1.0e-6
cp_ridge = 1.0e-10

[noise]
input_array_snr_db = []
matched_output_snr_db = [0.0]
include_noiseless = true

[evaluation]
path_match_range_scale_m = 0.05
path_match_angle_scale_deg = 2.0
path_success_range_tolerance_m = 0.03
path_success_angle_tolerance_deg = 1.0

[data_evaluation]
codebook_size = 64
codebook_seed_start = 2026091700
input_snr_db = 20.0
coherence_symbols_for_plot = [20, 50, 100]

[analysis]
primary_scenario = "nominal"
primary_noise_condition = "matched_output:0dB"
primary_design_family = "physical_frequency_response"
tensor_native_design_family = "physical_tensor_scan"
reference_estimator = "yang_ogols_adapted"
tensor_estimator = "zhang_cpd_ogols_adapted"
resource_reference_design_families = ["physical_tensor_scan"]
coherence_symbols = 50
tensor_rank_residual_warning_fraction = 0.05

[resources]
num_rf_outputs = 1
pilot_energy_per_re = 1.0
switch_guard_symbol_equivalents = 0.0
