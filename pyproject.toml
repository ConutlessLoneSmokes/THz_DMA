[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "thz-dma-direction1"
version = "0.4.0"
description = "Reproducible simulations for frequency-diverse THz DMA channel acquisition"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
  "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
cuda = ["torch>=2.5,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
