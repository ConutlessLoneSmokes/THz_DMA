name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Install CPU environment
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-linux.txt -e .
      - name: Check operators, portability, frozen evaluation and resume
        run: python -m unittest discover -s tests -v
      - name: MIMO prepare, four updates, validation and frozen test
        run: |
          python scripts/run_zhou2025_repro.py prepare --smoke --device cpu --run-id linux_ci_data
          python scripts/run_zhou2025_repro.py train --smoke --device cpu --run-id linux_ci_train --data-run-id linux_ci_data
          python scripts/run_zhou2025_repro.py evaluate --smoke --device cpu --run-id linux_ci_validation --data-run-id linux_ci_data --train-run-id linux_ci_train
          python scripts/run_zhou2025_repro.py evaluate --smoke --device cpu --run-id linux_ci_test --data-run-id linux_ci_data --train-run-id linux_ci_train --split test --tuning-run-id linux_ci_validation
